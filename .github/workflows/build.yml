# Quasar Horizons: builds the 26.3 NeoForge/Fabric jar on every push.
name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Build 26.3
        run: |
          chmod +x gradlew
          for i in 1 2 3; do
            ./gradlew build -PmcVer=26.3.0 -PinfoGitCommit="${GITHUB_SHA}" -PinfoGitBranch="${GITHUB_REF_NAME}" -PinfoBuildSource="Quasar Horizons GitHub CI" && break
            echo "build attempt $i failed, retrying"; sleep 20
          done
          mkdir -p out
          cp build/forgix/*.jar out/ 2>/dev/null || true
          cp neoforge/build/libs/*.jar out/ 2>/dev/null || true
          rm -f out/*-sources.jar out/*-dev.jar out/*-all.jar
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: quasar-horizons-26.3
          path: out/*.jar
